groups:
  - name: monitoring-alerts

    rules:

      - alert: ApplicationDown
        expr: up{job="monitoring-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Application Down"
          description: "The monitoring application is not reachable."

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{name="monitoring-app"}[1m]) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{name="monitoring-app"} > 300000000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High Memory Usage"
